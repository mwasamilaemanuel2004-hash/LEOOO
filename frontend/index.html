<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Backtester Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">QuantStrategy Pro</h1>
            <p class="text-lg text-slate-600">Professional-grade 10-year backtesting with real-world constraints.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Parameters Panel -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-8">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        Parameters
                    </h2>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Asset Symbol</label>
                            <input type="text" id="symbol" value="SPY" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2.5 border text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Strategy</label>
                            <select id="strategy" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2.5 border text-sm bg-white">
                                <option value="upgraded">Upgraded (SMA + RSI Filter)</option>
                                <option value="sma_crossover">Basic SMA Crossover</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Short SMA</label>
                                <input type="number" id="shortWindow" value="50" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2.5 border text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Long SMA</label>
                                <input type="number" id="longWindow" value="200" class="w-full rounded-lg border-slate-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2.5 border text-sm">
                            </div>
                        </div>
                        <div class="pt-4">
                            <button id="runBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-xl hover:bg-indigo-700 transition shadow-md shadow-indigo-200 flex items-center justify-center">
                                <span id="btnText">Execute Backtest</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="lg:col-span-3 space-y-8">
                <!-- Metrics Dashboard -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Return</p>
                        <p id="totalReturn" class="text-2xl font-bold text-indigo-600">-</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Sharpe Ratio</p>
                        <p id="sharpeRatio" class="text-2xl font-bold text-emerald-600">-</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Max Drawdown</p>
                        <p id="maxDrawdown" class="text-2xl font-bold text-rose-600">-</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Trade Count</p>
                        <p id="numTrades" class="text-2xl font-bold text-slate-800">-</p>
                    </div>
                </div>

                <!-- Charting Area -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-semibold text-slate-800">Portfolio Performance</h3>
                        <div id="commissionInfo" class="text-xs text-slate-400 italic">Commissions: -bash.00</div>
                    </div>
                    <div class="relative" style="height: 400px;">
                        <canvas id="equityChart"></canvas>
                    </div>
                </div>

                <!-- Analysis Summary -->
                <div id="analysisBox" class="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl hidden">
                    <h4 class="font-bold text-indigo-900 mb-2">Strategy Evaluation</h4>
                    <p id="analysisText" class="text-indigo-800 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        async function runBacktest() {
            const symbol = document.getElementById('symbol').value;
            const strategy = document.getElementById('strategy').value;
            const shortWindow = document.getElementById('shortWindow').value;
            const longWindow = document.getElementById('longWindow').value;
            const runBtn = document.getElementById('runBtn');
            const btnText = document.getElementById('btnText');

            runBtn.disabled = true;
            btnText.innerText = 'Analyzing Data...';

            try {
                const response = await fetch('/api/backtest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        symbol,
                        strategy,
                        short_window: parseInt(shortWindow),
                        long_window: parseInt(longWindow)
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    updateUI(data, symbol);
                } else {
                    alert('Error: ' + data.detail);
                }
            } catch (error) {
                alert('Failed to connect to backend engine');
            } finally {
                runBtn.disabled = false;
                btnText.innerText = 'Execute Backtest';
            }
        }

        function updateUI(data, symbol) {
            const m = data.metrics;
            document.getElementById('totalReturn').innerText = (m.total_return * 100).toFixed(2) + '%';
            document.getElementById('sharpeRatio').innerText = m.sharpe_ratio.toFixed(2);
            document.getElementById('maxDrawdown').innerText = (m.max_drawdown * 100).toFixed(2) + '%';
            document.getElementById('numTrades').innerText = m.num_trades;
            document.getElementById('commissionInfo').innerText = 'Estimated Commissions Paid: $' + m.total_commissions.toFixed(2);

            // Dynamic Analysis Text
            const analysisBox = document.getElementById('analysisBox');
            const analysisText = document.getElementById('analysisText');
            analysisBox.classList.remove('hidden');

            let evaluation = `Strategy executed ${m.num_trades} trades over 10 years. `;
            if (m.sharpe_ratio > 1.0) {
                evaluation += "The performance is excellent with a high risk-adjusted return (Sharpe > 1). ";
            } else if (m.sharpe_ratio > 0.5) {
                evaluation += "The strategy shows solid performance but remains exposed to market cycles. ";
            } else {
                evaluation += "The strategy might be too defensive or lag during strong bull runs. ";
            }

            if (m.max_drawdown < -0.3) {
                evaluation += "Warning: High drawdown detected. Consider increasing the long window or adding stop-losses.";
            } else {
                evaluation += "Drawdown control is effective for this asset.";
            }
            analysisText.innerText = evaluation;

            if (chart) chart.destroy();
            const ctx = document.getElementById('equityChart').getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(79, 70, 229, 0.1)');
            gradient.addColorStop(1, 'rgba(79, 70, 229, 0)');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.chart_data.labels,
                    datasets: [
                        {
                            label: 'Equity ($)',
                            data: data.chart_data.equity,
                            borderColor: '#4f46e5',
                            borderWidth: 2,
                            backgroundColor: gradient,
                            fill: true,
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            label: `${symbol} Price`,
                            data: data.chart_data.price,
                            borderColor: '#94a3b8',
                            borderWidth: 1.5,
                            borderDash: [5, 5],
                            pointRadius: 0,
                            yAxisID: 'y1',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            position: 'left',
                            title: { display: true, text: 'Portfolio Value' },
                            grid: { color: '#f1f5f9' }
                        },
                        y1: {
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Asset Price' }
                        }
                    },
                    plugins: {
                        legend: { position: 'top', align: 'end' }
                    }
                }
            });
        }

            document.getElementById('runBtn').addEventListener('click', runBacktest);
    </script>
</body>
</html>
